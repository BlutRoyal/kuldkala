<!doctype html>
<html lang="et">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0b0b0d" media="(prefers-color-scheme: dark)">
  <meta name="theme-color" content="#f5f5f7" media="(prefers-color-scheme: light)">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <meta name="referrer" content="no-referrer">
  <title>Kuldkala</title>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icons/icon-192.png">
  <link rel="apple-touch-icon" href="icons/icon-192.png">
  <link rel="stylesheet" href="style.css">
  <script src="config.js"></script>
  <script src="https://accounts.google.com/gsi/client" async defer></script>
  <script src="parse.js" defer></script>
  <script src="app.js" defer></script>
</head>
<body>
  <div id="login" class="screen hidden">
    <div class="login-box">
      <div class="logo">🐟</div>
      <h1>Kuldkala</h1>
      <p>Logi sisse oma Google'i kontoga.</p>
      <div id="gbtn"></div>
      <p id="login-msg" class="muted"></p>
    </div>
  </div>

  <div id="main" class="screen hidden">
    <header class="top">
      <div class="top-row">
        <div>
          <div id="today-date" class="eyebrow"></div>
          <h1 id="greeting">Tere</h1>
        </div>
        <div class="top-actions">
        <button id="bell" class="icon-btn hidden" aria-label="Luba teated">
          <svg viewBox="0 0 24 24"><path d="M6 8a6 6 0 1 1 12 0c0 7 3 9 3 9H3s3-2 3-9M10.3 21a1.94 1.94 0 0 0 3.4 0"/></svg>
        </button>
        <button id="refresh" class="icon-btn" aria-label="Värskenda">
          <svg viewBox="0 0 24 24"><path d="M20 11a8 8 0 1 0-2.3 5.7M20 4v7h-7"/></svg>
        </button>
        </div>
      </div>
      <div id="weather" class="weather"></div>
      <div id="today-summary" class="summary"></div>
    </header>

    <nav class="segmented" role="tablist">
      <button data-filter="all" class="active">Kõik</button>
      <button data-filter="Töö">Töö</button>
      <button data-filter="Era">Era</button>
    </nav>

    <div id="sync-msg" class="hidden"></div>
    <main id="list"></main>

    <button id="add" class="fab" aria-label="Lisa">
      <svg viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg>
    </button>
  </div>

  <dialog id="editor">
    <form id="task-form" method="dialog">
      <div class="grabber"></div>
      <h2 id="editor-title">Uus asi</h2>
      <input name="title" placeholder="nt homme kell 15 helista Peetrile #töö" autocomplete="off" required>
      <div id="parse-hint" class="hint"></div>
      <div class="seg" id="tag-seg">
        <button type="button" data-v="Era">Era</button>
        <button type="button" data-v="Töö">Töö</button>
      </div>
      <div class="row">
        <label>Tähtaeg <input type="date" name="due"></label>
        <label>Kell <input type="time" name="time"></label>
      </div>
      <input name="firstStep" placeholder="Esimene samm (~5 min)" autocomplete="off">
      <div class="seg" id="list-seg">
        <button type="button" data-v="">Tavaline</button>
        <button type="button" data-v="ootan">Ootan</button>
        <button type="button" data-v="kunagi">Kunagi</button>
      </div>
      <label class="select-row">Kordub
        <select name="repeat">
          <option value="">Ei kordu</option>
          <option value="day">Iga päev</option>
          <option value="week">Iga nädal</option>
          <option value="month">Iga kuu (nädalavahetusel reedel)</option>
          <option value="lastwork">Kuu viimane tööpäev</option>
          <option value="year">Iga aasta</option>
        </select>
      </label>
      <div id="log-box" class="log-box hidden">
        <div class="log-title">Jätk</div>
        <input name="logText" placeholder="nt saatsin kirja, vastus reedeks" autocomplete="off">
        <div class="log-actions">
          <button type="button" id="log-add">Lisa märge</button>
          <button type="button" id="log-wait">Ootan vastust</button>
        </div>
        <ul id="log-list"></ul>
      </div>
      <textarea name="notes" rows="3" placeholder="Märkmed"></textarea>
      <div class="actions">
        <button type="button" id="delete" class="danger hidden">Kustuta</button>
        <span class="spacer"></span>
        <button type="button" id="cancel">Loobu</button>
        <button type="submit" class="primary">Salvesta</button>
      </div>
    </form>
  </dialog>
</body>
</html>
